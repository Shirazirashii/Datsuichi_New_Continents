<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Datsuichi New Continents</title>
    <!-- Google Search Site Navigation Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "ダツイチー新大陸 主要メニュー",
        "description": "実務で生成AIを使いこなす自立駆動型学習コミュニティ「ダツイチー新大陸」のナビゲーション",
        "itemListElement": [
          {
            "@type": "SiteNavigationElement",
            "position": 1,
            "name": "ダツイチとは",
            "description": "自立駆動型学習コミュニティ「ダツイチー新大陸」の理念、目的、活動内容について紹介します。",
            "url": "https://datsuichi-new-continents.netlify.app/about"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 2,
            "name": "プロジェクト",
            "description": "生成AIを実務に活かすメンバーたちが主体となる、さまざまな実践デジタル活動やプロジェクトです。",
            "url": "https://datsuichi-new-continents.netlify.app/projects"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 3,
            "name": "団体運営",
            "description": "ダツイチー新大陸の運営事務局情報、代表メッセージ、団体概要をご案内します。",
            "url": "https://datsuichi-new-continents.netlify.app/community"
          },
          {
            "@type": "SiteNavigationElement",
            "position": 4,
            "name": "ニュース",
            "description": "公式サイトの公開情報やイベント情報など、最新の活動ニュースをお届けします。",
            "url": "https://datsuichi-new-continents.netlify.app/news"
          }
        ]
      }
    </script>
    <!-- Prefetch for remaining WebP images -->
    <link rel="prefetch" href="/src/assets/about_us.webp" as="image" />
    <link rel="prefetch" href="/src/assets/community.webp" as="image" />
    <link rel="prefetch" href="/src/assets/contact_us.webp" as="image" />
    <link rel="prefetch" href="/src/assets/datsuichi_new_hero.webp" as="image" />
    <link rel="prefetch" href="/src/assets/faq.webp" as="image" />
    <link rel="prefetch" href="/src/assets/news.webp" as="image" />
    <link rel="prefetch" href="/src/assets/project.webp" as="image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }).catch((err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
